name: Build macOS Universal Application

on:
  workflow_dispatch:
  push:
    branches: ['cmkb5']

jobs:
  build-macos-universal:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain (with both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Universal Binary)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload Universal DMG/APP
        uses: actions/upload-artifact@v4
        with:
          name: CMKB-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/**/*